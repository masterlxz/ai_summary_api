<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Entrar — Resumo AI</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    body {
      margin: 0;
      padding: 0;
      background: transparent;
    }

    .container {
      width: 340px;
      padding: 24px 16px;
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
      box-sizing: border-box;
      text-align: center;
    }

    .logo {
      font-size: 32px;
      margin-bottom: 8px;
    }

    h2 {
      margin: 0 0 6px;
      font-size: 18px;
      color: #1e293b;
    }

    .subtitle {
      font-size: 13px;
      color: #64748b;
      margin: 0 0 24px;
      line-height: 1.5;
    }

    #loginBtn {
      width: 100%;
      padding: 12px;
      background-color: white;
      color: #0f172a;
      border: 1px solid #cbd5e1;
      cursor: pointer;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      transition: background-color 0.2s ease, border-color 0.2s ease;
      box-sizing: border-box;
    }

    #loginBtn:hover { background-color: #f1f5f9; border-color: #94a3b8; }
    #loginBtn:disabled { opacity: 0.6; cursor: not-allowed; }

    .google-icon {
      width: 18px;
      height: 18px;
    }

    #status {
      margin-top: 14px;
      font-size: 13px;
      color: #64748b;
      min-height: 18px;
    }

    .error { color: #ef4444; font-weight: 500; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">✨</div>
    <h2>Resumo AI</h2>
    <p class="subtitle">Resume qualquer página em segundos.<br>Entre para salvar seu histórico e configurações.</p>

    <button id="loginBtn">
      <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Entrar com Google
    </button>

    <div id="status"></div>
  </div>

  <script src="login.js"></script>
</body>
</html>
